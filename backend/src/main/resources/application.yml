logging:
  level:
    root: INFO
    com.barbosa: DEBUG

server:
  port: 8080

spring:
  application:
    name: infinitecore-commerce

  banner:
    location: classpath:banner.txt

  datasource:
    url: jdbc:h2:mem:infinitecore
    driver-class-name: org.h2.Driver
    username: sa
    password: 123

  h2:
    console:
      path: /h2-console
      enabled: true

  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format-sql: true
